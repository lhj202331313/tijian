server:
  port: 8082

spring:
  application:
    name: doctorservice
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3310/health?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia%2FShanghai&allowPublicKeyRetrieval=true
    username: root
    password: 

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: boy.wang.doctorservice.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: doctorserviceJwtSecretKey2026HealthCheckup
  expiration: 86400000

logging:
  level:
    boy.wang.doctorservice.mapper: debug
